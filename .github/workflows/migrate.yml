name: Migrate Sewa Sanitary site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Copy website from source repository
        run: |
          git clone --depth 1 https://github.com/rojanxgit/sewasanitaryservice.git source
          rm -rf source/.git source/.github
          cp -a source/. .
          rm -rf source

      - name: Commit migrated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy complete Sewa Sanitary website [skip ci]" || exit 0
          git push
